<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京地铁站名故事</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🚇</text></svg>">
<link rel="stylesheet" href="leaflet/leaflet.css">
<style>
  :root{
    --bg:#0e1220; --panel:#171c2f; --line:#2a3252; --text:#e8ecf8;
    --muted:#9aa4c4; --accent:#ffd54a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;height:100vh;height:100dvh;width:100%}

  /* 地图 */
  #map{flex:1;position:relative;z-index:1}
  .leaflet-tile{filter:saturate(.72) brightness(.96)}
  .leaflet-container{background:#e8ecf8}
  .leaflet-bottom{margin-bottom:env(safe-area-inset-bottom,0px)}

  /* 线路样式 */
  .subway-line{stroke-linecap:round;stroke-linejoin:round}
  .station-dot{cursor:pointer}
  .station-label{
    background:none;border:none;box-shadow:none;color:#1b2340;
    font-weight:600;font-size:11px;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;
    padding:0 2px;white-space:nowrap;
  }
  .story-label{color:#7a5a00;font-weight:700}
  .hover-tip{font-size:12px}

  /* 顶栏 */
  #topbar{position:absolute;top:0;left:0;right:0;z-index:1000;padding:14px 20px;display:flex;gap:14px;align-items:center;background:linear-gradient(#0e1220ee,#0e122000);pointer-events:none}
  #topbar h1{font-size:18px;font-weight:700}
  #topbar .sub{color:var(--muted);font-size:12px;margin-top:2px}
  #search{pointer-events:auto;margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:20px;width:230px;font-size:13px;outline:none}
  #search:focus{border-color:var(--accent)}

  /* 搜索下拉 */
  #suggestions{position:absolute;top:58px;right:20px;width:250px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;z-index:1100;box-shadow:0 8px 30px #0008}
  #suggestions .item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:8px}
  #suggestions .item:hover{background:var(--line)}
  #suggestions .item .l{color:var(--muted);font-size:11px;flex-shrink:0}

  /* 图例（可收起） */
  #legend-wrap{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom,0px));left:12px;z-index:1100;max-width:min(560px,calc(100vw - 90px))}
  #legend-toggle{background:#1b2340f2;border:1px solid #3a4470;color:var(--text);border-radius:22px;padding:9px 18px;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:7px;box-shadow:0 4px 14px #0007}
  #legend-toggle:active{transform:scale(.96)}
  #legend-toggle .arrow{transition:.2s;display:inline-block;font-size:10px;color:var(--muted)}
  #legend-wrap.open #legend-toggle .arrow{transform:rotate(180deg)}
  #legend{display:none;background:#0e1220f2;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:6px;flex-wrap:wrap;gap:4px 12px;font-size:11px;color:var(--muted);max-height:32vh;max-width:calc(100vw - 24px);overflow-y:auto}
  #legend-wrap.open #legend{display:flex}
  #legend span{display:flex;align-items:center;gap:5px;cursor:pointer;border-radius:4px;padding:1px 4px}
  #legend span:hover{background:var(--line);color:var(--text)}
  #legend i{width:14px;height:4px;border-radius:2px;display:inline-block;flex-shrink:0}

  /* 右侧详情面板 */
  #panel{width:400px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 30px #0006;position:relative}
  #panel-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  #panel-head .lines{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .line-chip{font-size:11px;padding:2px 10px;border-radius:10px;color:#fff;font-weight:600}
  #panel-head h2{font-size:24px}
  #panel-body{padding:18px 22px;overflow-y:auto;flex:1;font-size:14px;line-height:1.95}
  #panel-body h3{color:var(--accent);font-size:13px;margin:14px 0 6px;letter-spacing:1px}
  #panel-body h3:first-child{margin-top:0}
  #panel-body .placeholder{color:var(--muted);text-align:center;margin-top:36%;line-height:2}
  #close-btn{position:absolute;top:14px;right:14px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer;z-index:5}
  #close-btn:hover{color:#fff}

  @media (max-width:800px){
    #panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);transform:translateX(100%);transition:.25s;z-index:2000}
    #panel.open{transform:none}
    #topbar h1{font-size:15px}
    #search{width:140px}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map">
    <div id="topbar">
      <div>
        <h1>北京地铁站名故事</h1>
        <div class="sub">真实地铁线路图 · 点击带金环的站点看名称由来与轶事</div>
      </div>
      <input id="search" placeholder="搜索站点名…" autocomplete="off">
    </div>
    <div id="suggestions"></div>
    <div id="legend-wrap">
      <button id="legend-toggle">🚇 线路 <span class="arrow">▲</span></button>
      <div id="legend"></div>
    </div>
  </div>
  <div id="panel">
    <button id="close-btn">✕</button>
    <div id="panel-head">
      <div class="lines" id="p-lines"></div>
      <h2 id="p-name"></h2>
    </div>
    <div id="panel-body"><div class="placeholder">← 点击地图上带金色描边的站点<br>查看它的名字由来与故事</div></div>
  </div>
</div>

<script src="leaflet/leaflet.js"></script>
<script src="data.js?v=2"></script>
<script src="app.js?v=2"></script>
</body>
</html>
