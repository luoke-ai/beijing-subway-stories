<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京地铁站名故事</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🚇</text></svg>">
<style>
  :root{
    --bg:#0e1220; --panel:#171c2f; --line:#2a3252; --text:#e8ecf8;
    --muted:#9aa4c4; --accent:#ffd54a;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;overflow:hidden}
  #app{display:flex;height:100vh}

  /* 左侧地图区 */
  #map-wrap{flex:1;position:relative;overflow:hidden}
  svg{width:100%;height:100%;display:block;cursor:grab}
  svg:active{cursor:grabbing}
  .line-path{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
  .line-label{font-size:11px;fill:#fff;paint-order:stroke;stroke:#0008;stroke-width:3px;font-weight:600}
  .station-dot{fill:#fff;stroke:#333;stroke-width:2;cursor:pointer}
  .station-dot.has-story{stroke:var(--accent);stroke-width:3}
  .station-dot:hover{r:8}
  .station-name{font-size:10px;fill:var(--text);paint-order:stroke;stroke:#0e1220cc;stroke-width:3px;pointer-events:none}

  /* 顶栏 */
  #topbar{position:absolute;top:0;left:0;right:0;padding:14px 20px;display:flex;gap:14px;align-items:center;background:linear-gradient(#0e1220ee,#0e122000);pointer-events:none}
  #topbar h1{font-size:18px;font-weight:700}
  #topbar .sub{color:var(--muted);font-size:12px}
  #search{pointer-events:auto;margin-left:auto;background:var(--panel);border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:20px;width:220px;font-size:13px;outline:none}
  #search:focus{border-color:var(--accent)}

  /* 右侧详情面板 */
  #panel{width:400px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;box-shadow:-8px 0 30px #0006}
  #panel-head{padding:20px 22px 14px;border-bottom:1px solid var(--line)}
  #panel-head .lines{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
  .line-chip{font-size:11px;padding:2px 10px;border-radius:10px;color:#fff;font-weight:600}
  #panel-head h2{font-size:24px}
  #panel-head .en{color:var(--muted);font-size:12px;margin-top:2px}
  #panel-body{padding:18px 22px;overflow-y:auto;flex:1;font-size:14px;line-height:1.9}
  #panel-body h3{color:var(--accent);font-size:13px;margin:14px 0 6px;letter-spacing:1px}
  #panel-body h3:first-child{margin-top:0}
  #panel-body .placeholder{color:var(--muted);text-align:center;margin-top:40%;line-height:2}
  #close-btn{position:absolute;top:16px;right:16px;background:none;border:none;color:var(--muted);font-size:20px;cursor:pointer}
  #close-btn:hover{color:#fff}

  /* 搜索下拉 */
  #suggestions{position:absolute;top:56px;right:20px;width:240px;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;z-index:10}
  #suggestions .item{padding:10px 14px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between}
  #suggestions .item:hover{background:var(--line)}
  #suggestions .item .l{color:var(--muted);font-size:11px}

  /* 图例 */
  #legend{position:absolute;bottom:14px;left:16px;display:flex;flex-wrap:wrap;gap:4px 12px;max-width:70%;font-size:11px;color:var(--muted)}
  #legend span{display:flex;align-items:center;gap:5px}
  #legend i{width:14px;height:4px;border-radius:2px;display:inline-block}

  #tip{position:absolute;background:#000c;color:#fff;padding:6px 10px;border-radius:6px;font-size:12px;pointer-events:none;display:none;z-index:20;white-space:nowrap}

  @media (max-width:800px){
    #panel{position:fixed;right:0;top:0;bottom:0;width:min(400px,92vw);transform:translateX(100%);transition:.25s;z-index:30}
    #panel.open{transform:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="map-wrap">
    <div id="topbar">
      <div>
        <h1>北京地铁站名故事</h1>
        <div class="sub">点击发光站点查看名称由来与轶事 · 拖拽/滚轮缩放地图</div>
      </div>
      <input id="search" placeholder="搜索站点名…" autocomplete="off">
    </div>
    <div id="suggestions"></div>
    <svg id="svg"></svg>
    <div id="legend"></div>
    <div id="tip"></div>
  </div>
  <div id="panel">
    <button id="close-btn">✕</button>
    <div id="panel-head">
      <div class="lines" id="p-lines"></div>
      <h2 id="p-name"></h2>
      <div class="en" id="p-en"></div>
    </div>
    <div id="panel-body"><div class="placeholder">← 点击地图上带金色描边的站点<br>查看它的名字由来与故事</div></div>
  </div>
</div>

<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
